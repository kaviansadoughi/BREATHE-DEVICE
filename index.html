<!DOCTYPE html>
<html>
  <head><title>ESP32 BLE Test</title></head>
  <body>
    <button id="connect">Connect to ESP32</button>

    <script>
      document.getElementById("connect").addEventListener("click", async () => {
        try {
          const device = await navigator.bluetooth.requestDevice({
            filters: [{ name: "ESP32-VOC-Sensor" }],
            optionalServices: ["12345678-1234-5678-1234-56789abcdef0"]
          });

          const server = await device.gatt.connect();
          console.log("Connected to GATT server:", server);

          const service = await server.getPrimaryService("12345678-1234-5678-1234-56789abcdef0");
          const characteristic = await service.getCharacteristic("abcd1234-5678-1234-5678-abcdef123456");

          async function readValue() {
            try {
              const value = await characteristic.readValue();
              const decoder = new TextDecoder("utf-8");
              console.log("PPM: ", decoder.decode(value));
            } catch (error) {
              console.error("Read error:", error);
            }
          }

          readValue();
          setInterval(readValue, 1000);

        } catch (error) {
          console.error("Connection error:", error);
        }
      });
    </script>
  </body>
</html>
